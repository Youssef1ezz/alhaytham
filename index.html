<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Physics Wave Field Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000); // سواد تام

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 7, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const count = 80;
    const numParticles = count * count;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(numParticles * 3);
    const colors = new Float32Array(numParticles * 3);

    let idx = 0;
    for (let i = 0; i < count; i++) {
        for (let j = 0; j < count; j++) {
            positions[idx * 3] = (i - count / 2) * 0.22;
            positions[idx * 3 + 1] = 0;
            positions[idx * 3 + 2] = (j - count / 2) * 0.22;
            idx++;
        }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // خامة النيون المضيئة (Neon Glow Blending)
    const material = new THREE.PointsMaterial({
        size: 0.11,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending // بيخلي الألوان تتوهج فوق بعضها
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // الشحنة المركزية (أحمر نيون مشع)
    const sphere1Mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
    const centerSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), sphere1Mat);
    scene.add(centerSphere);

    // الشحنة المرافقة للماوس (أزرق نيون مشع)
    const sphere2Mat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
    const mouseSphere = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), sphere2Mat);
    scene.add(mouseSphere);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-100, -100);
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const mouseWorld = new THREE.Vector3(100, 0, 100);

    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        raycaster.ray.intersectPlane(plane, mouseWorld);
        mouseSphere.position.copy(mouseWorld);
    });

    let clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime() * 3.5;
        const posAttr = particles.geometry.attributes.position;
        const colAttr = particles.geometry.attributes.color;

        for (let i = 0; i < numParticles; i++) {
            const x = posAttr.getX(i);
            const z = posAttr.getZ(i);

            const r1 = Math.sqrt(x * x + z * z) + 0.1;
            const r2 = Math.sqrt((x - mouseWorld.x) ** 2 + (z - mouseWorld.z) ** 2) + 0.1;

            // التراكب الموجي للفيزياء
            const wave = Math.sin(r1 * 2.2 - time) * 0.35 + Math.sin(r2 * 2.8 - time) * 0.25 * Math.exp(-r2 * 0.2);
            posAttr.setY(i, wave);

            // لوحة ألوان نيون مطابقة 100% (Neon Cyan & Electric Purple)
            const h = (wave + 0.5); 
            const r = Math.min(1.0, Math.max(0.0, 0.1 + (1.0 / (r2 + 0.5)) * 0.5)); // أحمر/وردي عند الشحنة والماوس
            const g = Math.min(1.0, Math.max(0.2, h * 0.85));                        // أخضر نيون مع قمة الموجة
            const b = Math.min(1.0, Math.max(0.6, 0.9 + h * 0.2));                   // أزرق فسفوري ساطع

            colAttr.setX(i, r);
            colAttr.setY(i, g);
            colAttr.setZ(i, b);
        }

        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>


</body>
</html>
